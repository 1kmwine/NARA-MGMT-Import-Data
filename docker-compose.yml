services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    # Reverted to a public port — the hub keeps hardcoding m11's iframe at
    # http://192.168.47.105:3001/, overwriting the path-based nginx setup on
    # every hub redeploy. See git history / project memory if revisiting.
    ports:
      - "8010:8000"
    volumes:
      - cache:/app/.cache
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://192.168.47.105:8010}
    env_file:
      - ./frontend/.env
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  cache:
