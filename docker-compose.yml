services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "8010:8000"
    volumes:
      - cache:/app/.cache
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://192.168.47.105:8010}
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  cache:
